    <script>
      (function() {
        // Fix: Provide a setter for window.fetch when intercepted by extensions or environments with getter-only fetch
        try {
          var _rawFetch = window.fetch;
          var _currentFetch = _rawFetch ? function() { return _rawFetch.apply(window, arguments); } : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            }
          });
        } catch (e) {
          // If non-configurable, ignore
        }

        // Suppress uncaught errors from browser extensions
        window.addEventListener('error', function(event) {
          var isExt = (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
                      (event.error && event.error.stack && event.error.stack.indexOf('chrome-extension://') !== -1);
          if (isExt) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var isExt = reason && reason.stack && reason.stack.indexOf('chrome-extension://') !== -1;
          if (isExt) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
